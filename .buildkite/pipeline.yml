steps:
  - label: ":docker: Build & Push"
    key: build
    commands:
      - export IMAGE_TAG=$BUILDKITE_COMMIT
      - export ECR_REPO=847143401367.dkr.ecr.ap-southeast-2.amazonaws.com/aichatapi
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin $ECR_REPO
      - docker build -t $ECR_REPO:$IMAGE_TAG -t $ECR_REPO:latest ./AIChatApi
      - docker push $ECR_REPO:$IMAGE_TAG
      - docker push $ECR_REPO:latest

  - label: ":rocket: Deploy to Fargate"
    key: deploy
    depends_on: build
    commands:
      - cd infra
      - npm ci
      - npx cdk deploy --require-approval never --parameters ImageTag=$BUILDKITE_COMMIT --region ap-southeast-2
