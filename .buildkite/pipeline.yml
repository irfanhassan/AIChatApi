steps:
  - label: ":docker: Build & Push"
    key: build
    agents:
      queue: default
    commands:
      - export IMAGE_TAG=$BUILDKITE_COMMIT
      - export ECR_REPO=YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/aichatapi
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REPO
      - docker build -t $ECR_REPO:$IMAGE_TAG -t $ECR_REPO:latest ./AIChatApi
      - docker push $ECR_REPO:$IMAGE_TAG
      - docker push $ECR_REPO:latest

  - label: ":rocket: Deploy to Fargate"
    key: deploy
    depends_on: build
    agents:
      queue: default
    commands:
      - cd infra
      - npm ci
      - npx cdk deploy --require-approval never --parameters ImageTag=$BUILDKITE_COMMIT
